<!DOCTYPE html>
<html>
  <head>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 24px; color: #242526; }
      .header { font-size: 1.7rem; font-weight: bold; margin-bottom: 1.2rem; }
      .section { margin-bottom: 18px; }
      .label { font-weight: bold; }
      .photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 7px; }
      .photo, .signature { max-width: 210px; max-height: 220px; margin: 5px 0; border-radius: 10px; border: 1px solid #bbb; }
    </style>
  </head>
  <body>
    <div class="header">Informe de Servicio</div>
    <div class="section"><span class="label">Cliente:</span> {{nombreCliente}}</div>
    <div class="section"><span class="label">Sitio:</span> {{sitio}}</div>
    <div class="section"><span class="label">Correo:</span> {{correo}}</div>
    <div class="section"><span class="label">Teléfono:</span> {{telefono}}</div>
    <div class="section"><span class="label">Técnico:</span> {{tecnico}}</div>
    <div class="section"><span class="label">Observaciones:</span> <br>{{detalles}}</div>
    <div class="section">
      <span class="label">Fotografías:</span>
      <div class="photos">
        {{fotos}}
      </div>
    </div>
    <div class="section">
      <span class="label">Firma:</span>
      {{firma}}
    </div>
  </body>
</html>
