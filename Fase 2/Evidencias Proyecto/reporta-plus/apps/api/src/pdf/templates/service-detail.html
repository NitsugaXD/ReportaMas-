<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Informe de Servicio - {{nombreCliente}}</title>
  <style>
    @page { margin: 24mm 16mm; }
    body { font-family: Inter, Arial, Helvetica, sans-serif; color: #111827; margin: 0; }
    .header {
      display:flex; align-items:center; justify-content:space-between;
      border-bottom: 2px solid #f3f4f6; padding: 10px 0 18px 0; margin-bottom: 12px;
    }
    .brand {
      display:flex; gap:12px; align-items:center;
    }
    .brand img { height:48px; width:auto; display:block; }
    img[src=""], img:not([src]) { display: none; }
    .title { font-size: 20px; font-weight: 700; color:#0f172a; }
    .meta { text-align:right; font-size:12px; color:#475569; }
    .meta .uid { font-weight:700; color:#0f172a; display:block; }

    .section { margin: 14px 0; }
    .section h3 { font-size:13px; margin:0 0 8px 0; color:#0f172a; }
    .grid-2 { display:flex; gap:10px; flex-wrap:wrap; }
    .col { flex:1 1 220px; min-width:220px; }

    .card { background:#fff; padding:10px; border-radius:6px; box-shadow: 0 6px 18px rgba(15,23,42,0.04); border:1px solid #e6e9ef; }

    .photos-grid {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
      margin-top:8px;
    }
    .photos-grid img { width:100%; height:auto; border-radius:6px; object-fit:cover; border:1px solid #e6e9ef; }

    .notes { white-space: pre-wrap; font-size:13px; color:#0f172a; }

    .signature-box {
      border: 1px dashed #cbd5e1;
      padding: 12px;
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:120px;
      background: linear-gradient(180deg, rgba(240,176,64,0.02), rgba(243,139,31,0.01));
    }
    .signature-box img { max-height: 120px; width: auto; }

    .footer {
      display:flex; justify-content:space-between; align-items:center; margin-top:18px; border-top:1px solid #eef2ff; padding-top:8px; font-size:11px; color:#6b7280;
    }

    .page-break { page-break-before: always; }

    @media (max-width:480px) {
      .photos-grid { grid-template-columns: repeat(2,1fr); }
      .meta { text-align:left; margin-top:8px; }
    }
  </style>
</head>
<body>
  <div class="pdf-container">
    <div class="header">
      <div class="brand">
        <img src="{{logoUrl}}" alt="Logo" />
        <div>
          <div class="title">Informe de Servicio</div>
          <div style="font-size:12px;color:#6b7280;">Reporte generado por Reporta+</div>
        </div>
      </div>
      <div class="meta">
        <span class="uid">Folio: {{serviceUid}}</span>
        <span>{{sitio}}</span><br/>
        <span>{{telefono}}</span>
      </div>
    </div>

    <div class="section grid-2">
      <div class="col card">
        <strong>Cliente</strong><br/>
        <div>{{nombreCliente}}</div>
        <div style="font-size:12px;color:#6b7280;">{{correo}}</div>
      </div>
      <div class="col card">
        <strong>Técnico</strong><br/>
        <div>{{tecnico}}</div>
        <div style="font-size:12px;color:#6b7280;">Fecha: {{fecha}}</div>
      </div>
    </div>

    <div class="section">
      <h3>Observaciones</h3>
      <div class="card notes">{{detalles}}</div>
    </div>

    <div class="section">
      <h3>Fotografías</h3>
      <div class="photos-grid">
        {{fotos}}
      </div>
    </div>

    <div class="section">
      <h3>Firma</h3>
      <div class="signature-box">
        {{firma}}
      </div>
    </div>

    <div class="footer">
      <div>Reporta+ — Registro y Evidencias</div>
      <div>Generado: <span id="pdate">{{generatedAt}}</span></div>
    </div>
  </div>
</body>
</html>
